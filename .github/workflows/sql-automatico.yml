name: SQL automático
# Aplica no Supabase, uma única vez cada, os arquivos novos de sql/migracoes/ (em ordem de nome).
on:
  push:
    branches: [main]
    paths: ['sql/migracoes/**']
  workflow_dispatch:
concurrency: { group: sql-automatico, cancel-in-progress: false }
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar SQLs novos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          exec 2> >(sed -E 's/"[^"]*"/"***"/g; s#postgres(ql)?://[^ ]*#postgres://***#g' >&2)
          if [ -z "${DB:-}" ]; then echo "::error::Falta o segredo SUPABASE_DB_URL"; exit 1; fi
          # diagnóstico sem mostrar a senha
          case "$DB" in postgresql://*|postgres://*) echo "formato: começa certo";; *) echo "::error::O segredo não começa com postgresql:// (confira se colou o texto inteiro, sem aspas nem espaços)"; exit 1;; esac
          echo "tem @: $(echo "$DB" | grep -c @)  ·  servidor: $(echo "$DB" | sed -E 's#.*@##; s#[:/].*##' | sed -E 's#^[^.]*#…#')  ·  espaços: $(echo -n "$DB" | tr -cd ' ' | wc -c)"
          # lê o endereço em partes (aceita senha com caracteres especiais e tira colchetes que sobraram)
          eval "$(python3 - <<'PY'
          import os,shlex
          u=os.environ['DB'].strip()
          r=u.split('://',1)[1]; cred,_,hp=r.rpartition('@'); user,_,pw=cred.partition(':')
          pw=pw.strip(); pw=pw[1:-1] if pw.startswith('[') and pw.endswith(']') else pw
          hostport,_,db=hp.partition('/'); db=(db.split('?')[0] or 'postgres'); host,_,port=hostport.partition(':')
          for k,v in dict(PGUSER=user,PGPASSWORD=pw,PGHOST=host,PGPORT=port or '5432',PGDATABASE=db,PGSSLMODE='require').items(): print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          echo "::add-mask::$PGPASSWORD"
          echo "colchetes na senha: $( [ "$(echo "$DB" | grep -c '\[')" = "1" ] && echo sim-removidos || echo não )"
          DB=""
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql -v ON_ERROR_STOP=1 -q -c "create table if not exists public.hs_migracoes (nome text primary key, aplicado_em timestamptz not null default now()); alter table public.hs_migracoes enable row level security; revoke all on public.hs_migracoes from anon, authenticated;"
          n=0; feitos=""; atual=""
          avisar(){ python3 - "$1" "$2" "$3" <<'PY' | psql -q -v ON_ERROR_STOP=0 >/dev/null 2>&1 || true
          import sys,json,datetime
          ok,feitos,erro=sys.argv[1]=='1',[x for x in sys.argv[2].split('|') if x],sys.argv[3]
          v=json.dumps({'ok':ok,'em':datetime.datetime.utcnow().isoformat()+'Z','aplicados':feitos,'erro':erro},ensure_ascii=False).replace("'","''")
          print(f"insert into public.hs_sync(chave,tipo,valor,apagado,atualizado_por) values ('robo:sql','robo','{v}'::jsonb,false,'robô SQL') on conflict (chave) do update set valor=excluded.valor, atualizado_por=excluded.atualizado_por;")
          PY
          }
          trap 'avisar 0 "$feitos" "falhou em: ${atual}"' ERR
          for f in $(ls sql/migracoes/*.sql 2>/dev/null | sort); do
            nome=$(basename "$f")
            ja=$(psql -tA -c "select 1 from public.hs_migracoes where nome='${nome}'")
            if [ "$ja" = "1" ]; then echo "✓ já aplicado: $nome"; continue; fi
            echo "▶ aplicando: $nome"; atual="$nome"
            psql -v ON_ERROR_STOP=1 -1 -q -f "$f"
            psql -q -c "insert into public.hs_migracoes(nome) values ('${nome}')"
            desc=$(grep -m1 -E '^-- ' "$f" | sed -E 's/^-- *//; s/\|/-/g' | cut -c1-90)
            feitos="${feitos}|${desc:-$nome}"
            echo "✔ aplicado: $nome"; n=$((n+1))
          done
          if [ "$n" -gt 0 ]; then avisar 1 "$feitos" ""; fi
          echo "Concluído: $n arquivo(s) novo(s) aplicado(s)."
