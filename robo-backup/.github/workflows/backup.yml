name: Backup diário do Health Search
on:
  schedule:
    - cron: '17 6 * * *'   # 03:17 em Brasília, todo dia
  workflow_dispatch: {}    # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copiar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node backup.mjs
      - name: Guardar no repositório
        run: |
          git config user.name "Robô de backup"
          git config user.email "robo@users.noreply.github.com"
          git add -A
          git commit -m "Backup $(TZ=America/Sao_Paulo date +%d-%m-%Y)" || echo "nada novo"
          git push
